<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GROW A GARDEN — Большое обновление</title>
<style>
:root{--g1:#43a047;--g2:#2e7d32;--g3:#1b5e20;--b1:#a1693a;--b2:#7a4a26;--b3:#4e2f16;--tan:#f3e2b3;--tan2:#e2c98f;--ink:#3a2410}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#5e8d3c;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif}
button,input{font:inherit}
.stud,button::before,.hudBrick::before,#coinBox::before,#side::before,.item::before,#hint::before,#toast::before{content:"";position:absolute;left:9px;right:9px;top:-6px;height:7px;pointer-events:none;background:radial-gradient(ellipse 5px 3.5px at 50% 55%,var(--c) 98%,transparent) 0 0/17px 7px repeat-x}
button{--c:var(--g1);--d:var(--g3);position:relative;cursor:pointer;border:0;border-radius:6px;padding:10px 14px;margin-top:8px;background:var(--c);color:#fff;font-weight:800;letter-spacing:.2px;text-shadow:0 1px 0 rgba(0,0,0,.35);box-shadow:0 5px 0 var(--d),inset 0 2px 0 rgba(255,255,255,.3);transition:transform .08s,box-shadow .08s}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d),inset 0 2px 0 rgba(255,255,255,.3)}
button:disabled{filter:grayscale(.75) brightness(.85);cursor:not-allowed}
button.secondary{--c:var(--b1);--d:var(--b3)}
button.gold{--c:#e7ac2b;--d:#9a6a10}
#game{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block;touch-action:none}
.hudBrick{--c:var(--g2);--d:var(--g3);position:relative;border-radius:8px;padding:8px 14px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4);background:var(--c);box-shadow:0 5px 0 var(--d),0 9px 14px rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.28)}
.hudBrick.b{--c:var(--b2);--d:var(--b3)}
.lab{display:block;font-size:11px;font-weight:700;opacity:.9;margin-bottom:2px}
.val{display:block;font-size:17px;font-weight:900;line-height:1.1}
#top{position:absolute;top:16px;left:14px;display:flex;align-items:stretch;gap:12px;z-index:5}
#top button{margin:0;padding:0 14px;font-size:20px}
#lvlBox{min-width:104px}
.bar{height:9px;margin-top:4px;background:rgba(0,0,0,.35);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#9be36a 0 9px,#5fae3d 9px 10px)}
#coinBox{--c:var(--b2);--d:var(--b3);position:absolute;top:16px;right:14px;z-index:5;display:flex;align-items:center;gap:11px;padding:9px 20px 10px 12px;border-radius:9px;background:var(--c);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4);box-shadow:0 6px 0 var(--d),0 10px 16px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.22)}
#coinBox .val{font-size:27px}
#coinBox.bump{animation:bump .35s}
#eventDock{position:absolute;top:82px;right:14px;z-index:7;display:none;width:min(290px,72vw);max-height:48vh;overflow:auto;pointer-events:auto}
#eventDock.show{display:block}
.eventChip{display:flex;align-items:center;gap:8px;padding:7px 10px;border:2px solid #f5d16a;border-radius:9px;background:linear-gradient(135deg,#493b20ee,#76521cee);color:#fff;box-shadow:0 3px 0 #382513,0 6px 12px #0005;text-align:left;width:100%;margin:0 0 7px;font:inherit}
.eventEmoji{font-size:23px;line-height:1}.eventText{min-width:0;display:flex;flex:1;flex-direction:column;gap:2px}.eventName{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.eventTime{font-size:10px;opacity:.85}
.eventCount{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#e9b735;color:#3a2410;font-size:11px;font-weight:900}
#side button.playNav{--c:#d4a832;--d:#8b6417;background:linear-gradient(180deg,#ffe77b,#d49b22);color:#30220b;border:1px solid #ffe99a;box-shadow:0 3px 0 #8b6417,inset 0 2px 0 #ffffff88;font-weight:1000}
#side button.playNav .navIcon{font-size:18px}
#side button.playNav:active{transform:translateY(2px);box-shadow:0 1px 0 #8b6417}
@media(max-width:700px){#eventDock{top:62px;right:8px;width:min(205px,58vw);max-height:42vh}.eventChip{padding:5px 7px;gap:5px}.eventEmoji{font-size:19px}.eventName{font-size:10px}.eventTime{font-size:9px}}
#winterBadge{position:absolute;left:50%;top:82px;transform:translateX(-50%);z-index:6;display:none;padding:7px 13px;border:2px solid #d7f4ff;border-radius:20px;background:#174d70dd;color:#fff;font-weight:900;box-shadow:0 3px 0 #0c3049}#winterBadge.show{display:block}
.winterHero{padding:18px;border:2px solid #bceaff;border-radius:12px;background:linear-gradient(145deg,#dff7ff,#a8d8f0 55%,#eafaff);color:#17435c;text-align:center;margin-bottom:12px}.winterHero .snowBig{font-size:42px}.winterMission{border:2px solid #b6ddeb;background:#f0fbff;border-radius:10px;padding:11px;margin:8px 0;color:#24485a}.winterMission button{margin-top:7px}
@keyframes bump{40%{transform:scale(1.1)}}
.coinIcon{position:relative;flex:0 0 42px;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff0a8,#f2b823 55%,#b87a0e);border:3px solid #8a5a0f;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 2px 0 #4e2f16}
.coinIcon::after{content:"";position:absolute;inset:8px;border-radius:50%;border:2px solid rgba(138,90,15,.65)}
#side{--c:var(--b2);--d:var(--b3);position:absolute;left:14px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:7px;padding:12px 8px 9px;border-radius:9px;background:var(--c);box-shadow:0 6px 0 var(--d),0 10px 16px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.2)}
#side button{display:flex;align-items:center;gap:8px;width:132px;height:36px;margin:0;padding:0 8px;text-align:left;font-size:13px;--c:var(--g2);--d:var(--g3);box-shadow:0 3px 0 var(--d),inset 0 2px 0 rgba(255,255,255,.25)}
#side button::before{display:none}
#side button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--d)}
.navIcon{display:inline-flex;align-items:center;justify-content:center;flex:0 0 24px;width:24px;height:24px;border-radius:4px;background:var(--tan);color:var(--b3);font:900 14px Georgia,serif;text-shadow:none;box-shadow:0 2px 0 var(--b1)}
#toast{--c:var(--b2);position:absolute;top:92px;left:50%;transform:translateX(-50%);padding:10px 18px;background:var(--b2);color:#fff;border-bottom:4px solid var(--b3);border-radius:8px;opacity:0;pointer-events:none;transition:.25s;z-index:20;font-size:14px;font-weight:700}
#toast.show{opacity:1;top:100px}
#announcement{position:absolute;top:92px;left:50%;transform:translateX(-50%);z-index:8;max-width:92vw;text-align:center;color:#fff;font:900 clamp(18px,3vw,30px)/1.15 "Trebuchet MS",system-ui,sans-serif;text-shadow:0 2px 3px #18251dcc,0 0 8px #17251caa;pointer-events:none;white-space:pre-wrap;overflow-wrap:anywhere;display:none}
#announcement.show{display:block;animation:announceIn .35s ease-out}
@keyframes announceIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
#modal{position:absolute;inset:0;background:rgba(30,45,18,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
#modal.show{display:flex}
.panel{width:min(620px,100%);max-height:min(82vh,780px);overflow:auto;background:var(--tan);border:6px solid var(--b2);border-radius:12px;box-shadow:0 8px 0 var(--b3),0 22px 50px rgba(0,0,0,.45);padding:18px}
.panelHead{display:flex;justify-content:space-between;align-items:center;margin:-18px -18px 16px;padding:11px 16px;background:var(--g2);border-bottom:5px solid var(--g3);color:#fff}
.panel h2{margin:0;font-size:22px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.panel h3{color:var(--b2)}
.close{--c:var(--b1);--d:var(--b3);margin:0;padding:6px 12px}
.close::before{display:none}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px 12px;padding-top:6px}
.item{--c:var(--b1);position:relative;min-width:0;padding:14px 12px 12px;background:#fff3cf;border:3px solid var(--b1);border-radius:8px;box-shadow:0 4px 0 var(--b2)}
.item h3{margin:0 0 5px;font-size:16px;color:var(--g3)}
.item p{margin:0 0 6px;font-size:13px;line-height:1.45;color:#6b5232}
.item button{width:100%;padding:9px;font-size:13px}
.row{display:flex;gap:9px;align-items:center;justify-content:space-between}
.muted{color:#7d6542;font-size:13px}
#mobile{display:none;position:absolute;bottom:22px;left:16px;right:16px;justify-content:space-between;align-items:end;pointer-events:none;z-index:4}
#stick{position:relative;width:112px;height:112px;border-radius:50%;background:rgba(122,74,38,.6);border:5px solid var(--b3);pointer-events:auto;touch-action:none;box-shadow:0 6px 0 rgba(0,0,0,.25)}
#knob{position:absolute;left:33px;top:33px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7bd27f,#2e7d32);border:3px solid var(--g3);box-shadow:0 3px 0 var(--g3)}
.actions{display:flex;gap:12px;pointer-events:auto}
.actions button{width:62px;height:62px;margin:0;padding:0;font-size:22px}
.actionIcon{color:#fff}
#login{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 50%,#6cc470 0 8px,transparent 9px) 0 0/46px 46px,radial-gradient(circle at 50% 54%,#2a7a2e 0 12px,transparent 13px) 0 0/46px 46px,#3f9a44}
#login.hidden{display:none}
#welcomeGate{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 35%,#315c38 0,#172b1d 58%,#09130d 100%);}
.welcomeCard{width:min(460px,100%);padding:30px 24px;text-align:center;border:2px solid #729b55;border-radius:24px;background:linear-gradient(160deg,#213c27,#102017);box-shadow:0 24px 70px #000b,inset 0 1px #ffffff22;color:#f2ffe9}
.welcomeLogo{font-size:clamp(36px,9vw,58px);margin-bottom:8px;filter:drop-shadow(0 5px 0 #0005)}
.welcomeCard h1{margin:0;color:#c5f28a;font-size:clamp(27px,7vw,38px);font-weight:1000;letter-spacing:1px;text-shadow:0 3px 0 #31552a}
.welcomeCard p{margin:10px 0 24px;color:#c3d8bb;font-size:14px}
#welcomePlay{width:100%;max-width:290px;padding:17px 24px;border:2px solid #fff0a5;border-radius:14px;background:linear-gradient(180deg,#ffe77a,#d39b20);color:#30220b;font-size:23px;font-weight:1000;box-shadow:0 6px 0 #805916,0 12px 24px #0005;}
#welcomePlay:active{transform:translateY(4px);box-shadow:0 2px 0 #805916}
.loginCard{width:min(410px,100%);padding:24px;background:var(--tan);border:6px solid var(--b2);border-radius:12px;box-shadow:0 8px 0 var(--b3),0 24px 60px rgba(0,0,0,.4);text-align:center}
.loginCard h1{margin:4px 0 6px;font-size:30px;font-weight:900;color:var(--g3);text-shadow:0 3px 0 #cfae6e}
.loginCard p{margin:6px 0;font-size:14px;line-height:1.5;color:#6b5232}
.loginCard input{width:100%;padding:13px;margin:12px 0 6px;border:3px solid var(--b1);border-radius:8px;background:#fffaf0;color:var(--ink);outline:none}
.loginCard input:focus{border-color:var(--g1)}
.loginCard button{width:100%;font-size:16px}
.legoLogo{display:flex;gap:5px;justify-content:center;margin:6px 0 12px}
.legoLogo i{--c:var(--g1);--d:var(--g3);position:relative;width:42px;height:28px;border-radius:4px;background:var(--c);box-shadow:0 5px 0 var(--d),inset 0 2px 0 rgba(255,255,255,.3)}
.legoLogo i::before{content:"";position:absolute;left:5px;right:5px;top:-6px;height:7px;background:radial-gradient(ellipse 5px 3.5px at 50% 55%,var(--c) 98%,transparent) 0 0/16px 7px repeat-x}
.legoLogo i:nth-child(2n){--c:var(--b1);--d:var(--b3)}
@media(max-width:700px){
#top{top:10px;left:8px;gap:8px}
#top .hudBrick.g{display:none}
.val{font-size:15px}
#coinBox{top:10px;right:8px;padding:7px 12px 8px 8px;gap:7px}
#coinBox .val{font-size:20px}
.coinIcon{flex-basis:32px;width:32px;height:32px}
#side{top:78px;left:8px;transform:none;padding:10px 6px 7px;gap:6px;max-height:calc(100% - 215px);overflow-y:auto}
#side button{width:104px;height:31px;font-size:11px;padding:0 5px;gap:5px}
.navIcon{flex-basis:20px;width:20px;height:20px;font-size:12px}
#mobile{display:flex}
.panel{max-height:76vh;padding:15px}
.panelHead{margin:-15px -15px 14px}
.items{grid-template-columns:repeat(2,minmax(0,1fr))}
#toast{top:84px}#toast.show{top:92px}
}

@media(pointer:coarse){#mobile{display:flex}}
#tutLayer{position:absolute;inset:0;z-index:40;pointer-events:none;display:none}
#tutLayer.show{display:block}
#tutSpot{position:absolute;border:4px solid #ffd54a;border-radius:12px;box-shadow:0 0 0 9999px rgba(12,22,8,.55),0 0 16px 2px #ffd54a;transition:left .2s,top .2s,width .2s,height .2s}
#tutHand{position:absolute;font-size:38px;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
#tutHand span{display:block;animation:poke .7s ease-in-out infinite alternate}
@keyframes poke{to{transform:translateY(-10px)}}
#tutCard{position:absolute;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 24px));pointer-events:auto;padding:0 14px 12px;background:var(--tan);border:5px solid var(--b2);border-radius:12px;box-shadow:0 6px 0 var(--b3),0 16px 36px rgba(0,0,0,.45)}
#tutCard .th{margin:0 -14px 10px;padding:8px 14px;background:var(--g2);border-bottom:4px solid var(--g3);border-radius:6px 6px 0 0;color:#fff;font-weight:900;font-size:17px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
#tutCard p{margin:0 0 8px;font-size:15px;line-height:1.45;text-align:center}
.tdots{display:flex;gap:4px;justify-content:center;margin:0 0 9px}
.tdots i{width:12px;height:8px;border-radius:2px;background:#cdb27a}
.tdots i.on{background:var(--g1)}
.tutHint{display:none;margin:0 0 6px;text-align:center;font-weight:800;font-size:13px;color:#c2570c}
.tutBar{height:12px;margin:0 0 6px;border-radius:6px;background:#cdb27a;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.15)}
.tutBar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#6fcf4a 0 9px,#3f9a2e 9px 10px)}
.tutBtns{display:flex;flex-direction:column;align-items:stretch}
.tutBtns button{margin-top:9px;font-size:14px}
.rar{display:inline-block;margin:0 0 7px;padding:2px 9px;border-radius:4px;color:#fff;font-size:11px;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.item.out{opacity:.6}
.items>.item{display:flex;flex-direction:column}
.items>.item p{flex:1}
.timerPill{padding:5px 12px;border-radius:6px;background:var(--b2);color:#fff;box-shadow:0 3px 0 var(--b3)}
.item select,.item input{display:block;width:100%;padding:10px;margin:8px 0 0;border:3px solid var(--b1);border-radius:8px;background:#fffaf0;color:var(--ink);font:inherit;outline:none}

#winterCutscene{background:radial-gradient(ellipse at 50% 25%,#b9eaff 0,#4d87b5 45%,#172b4c 100%);border:3px solid #d8f5ff;border-radius:14px;padding:16px;color:#fff;text-align:center;box-shadow:inset 0 0 35px #d6f6ff55}
#winterCutscene .crashScene{font-size:clamp(48px,13vw,86px);line-height:1.25;text-shadow:0 5px 8px #14233b;letter-spacing:3px}
#winterCutscene p{color:#f2fbff;line-height:1.5}
#winterCutscene .sceneTitle{font-size:22px;font-weight:1000;letter-spacing:2px}
.winterMission{color:#24485a}

#stormCutscene{position:absolute;inset:0;z-index:80;display:none;overflow:hidden;background:radial-gradient(ellipse at 50% 15%,#53627c 0,#172033 48%,#080d18 100%);isolation:isolate}
#stormCutscene.show{display:block;animation:stormIn .35s ease-out}
#stormCutscene .stormCloud{position:absolute;inset:-15%;background:radial-gradient(ellipse at 20% 20%,#667184 0 8%,transparent 28%),radial-gradient(ellipse at 75% 16%,#3f4b60 0 12%,transparent 32%),radial-gradient(ellipse at 48% 28%,#29364b 0 18%,transparent 42%);filter:blur(13px);animation:cloudRoll 4s ease-in-out infinite alternate}
#stormCutscene .stormRain{position:absolute;inset:-30%;opacity:.65;background:repeating-linear-gradient(108deg,transparent 0 18px,#b9d8f0a8 19px 21px,transparent 22px 42px);animation:stormRain .22s linear infinite}
#stormCutscene .stormBolt{position:absolute;left:50%;top:5%;width:min(34vw,230px);height:88%;transform:translateX(-50%);filter:drop-shadow(0 0 16px #d9f3ff);opacity:0;animation:boltFlash 1.35s ease-in-out infinite}
#stormCutscene .stormBolt path{fill:none;stroke:#f4fbff;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
#stormCutscene .stormFlash{position:absolute;inset:0;background:#eaf7ff;opacity:0;animation:flash 1.35s ease-in-out infinite}
#stormCutscene .stormGround{position:absolute;left:-10%;right:-10%;bottom:-22%;height:48%;border-radius:50%;background:radial-gradient(ellipse,#d6e9ff44,transparent 68%);filter:blur(18px);animation:groundPulse .8s ease-in-out infinite alternate}
@keyframes stormIn{from{opacity:0}to{opacity:1}}@keyframes cloudRoll{to{transform:translateX(4%) translateY(3%) scale(1.08)}}@keyframes stormRain{to{transform:translate(-35px,65px)}}@keyframes boltFlash{0%,38%,100%{opacity:0}40%,45%{opacity:1}47%,68%{opacity:0}70%,74%{opacity:.8}76%{opacity:0}}@keyframes flash{0%,38%,100%{opacity:0}40%{opacity:.55}43%,69%{opacity:0}70%{opacity:.32}73%{opacity:0}}@keyframes groundPulse{to{opacity:.45;transform:scale(1.15)}}
#goldCoinRain{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.goldRainCoin{position:absolute;top:-48px;width:17px;height:17px;border-radius:50%;border:3px solid #a96d0b;background:radial-gradient(circle at 32% 25%,#fff5a7,#ffd33d 48%,#c27b08);box-shadow:0 0 12px #ffd34d;animation:coinFall var(--fall,3s) linear forwards;animation-delay:var(--delay,0s)}
@keyframes coinFall{0%{transform:translate3d(0,-8vh,0) rotateY(0) rotate(0);opacity:0}8%{opacity:1}100%{transform:translate3d(var(--drift,30px),115vh,0) rotateY(720deg) rotate(540deg);opacity:.9}}

/* GROW A GARDEN — тёмная мобильная тема в стиле референса */
:root{--g1:#82d64d;--g2:#4c8d37;--g3:#234b25;--b1:#65734b;--b2:#263b29;--b3:#142419;--tan:#17251b;--tan2:#203426;--ink:#e8f2e5}
html,body{background:#101a13;color:#e8f2e5;font-family:Inter,"Trebuchet MS","Segoe UI",sans-serif}
button{border-radius:9px;letter-spacing:0;background:linear-gradient(180deg,#8ddd51,#5ca83a);color:#10200f;text-shadow:none;box-shadow:0 3px 0 #315c26,inset 0 1px 0 #ffffff55}
button.secondary{--c:#314a38;--d:#1a2c20;background:linear-gradient(180deg,#405e47,#293f30);color:#e8f2e5;box-shadow:0 3px 0 #17251b,inset 0 1px 0 #ffffff20}
button.gold{--c:#e5b932;--d:#87641a;background:linear-gradient(180deg,#f4d15a,#d69d22);color:#35250b}
button::before,.hudBrick::before,#coinBox::before,#side::before,.item::before,#hint::before,#toast::before{display:none}
.hudBrick{background:#1c2d21;border:1px solid #426044;box-shadow:0 4px 12px #0007,inset 0 1px 0 #ffffff18;border-radius:10px}
.hudBrick.b{background:#263a2b;border-color:#536a49}
#top{top:10px;left:10px;gap:7px}
#top button{border-radius:9px;min-width:42px;min-height:42px;background:#263b2b;color:#e6f4df;border:1px solid #58724d;box-shadow:0 3px 0 #14251a}
#coinBox{top:10px;right:10px;background:#273c2a;border:1px solid #647849;border-radius:11px;box-shadow:0 4px 12px #0007,inset 0 1px 0 #ffffff20;padding:7px 12px;gap:8px}
#coinBox .val{font-size:22px;color:#b9ee69}
.coinIcon{width:32px;height:32px;flex-basis:32px;border:2px solid #9c781f}
#side{position:fixed;top:auto;left:0;bottom:0;transform:none;z-index:9;display:flex;flex-direction:row;justify-content:flex-start;gap:4px;width:100%;padding:7px 8px calc(7px + env(safe-area-inset-bottom));overflow-x:auto;overflow-y:hidden;border:1px solid #3a573e;border-radius:14px;background:#111d15ee;box-shadow:0 8px 28px #0009;backdrop-filter:blur(12px)}

let goldenStormTimer=null;
function playGoldenStorm(duration,broadcast=true,mult=0){
 const layer=$('stormCutscene');if(!layer)return;
 if(goldenStormTimer)clearTimeout(goldenStormTimer);
 $('modal').classList.remove('show');layer.classList.remove('show');void layer.offsetWidth;layer.classList.add('show');layer.setAttribute('aria-hidden','false');playSfx('event');
 if(broadcast&&presenceChannel)presenceChannel.postMessage({type:'golden_storm',duration,mult});if(broadcast)gardenPublishEvent('Золотой дождь',mult,duration);
 goldenStormTimer=setTimeout(()=>{layer.classList.remove('show');layer.setAttribute('aria-hidden','true');startVfx('Золотой дождь',false,duration,mult);spawnGoldenCoins();},4300);
}
function spawnGoldenCoins(){

 for(let i=0;i<95;i++){const coin=document.createElement('i');coin.className='goldRainCoin';coin.style.left=(Math.random()*100)+'%';coin.style.setProperty('--fall',(2.2+Math.random()*2.8)+'s');coin.style.setProperty('--delay',(Math.random()*2.4)+'s');coin.style.setProperty('--drift',((Math.random()-.5)*150)+'px');rain.appendChild(coin);}
 setTimeout(()=>{if(rain)rain.innerHTML='';},8500);
}

 if(s.bar)$('tutBar').style.width=Math.round(s.bar()*100)+'%';
 const r=s.r()||{x:vw/2-40,y:vh/2-40,w:80,h:80},k=[r.x,r.y,r.w,r.h].map(Math.round).join();
 if(k===tutKey)return;tutKey=k;
 const sp=$('tutSpot').style;sp.left=r.x-4+'px';sp.top=r.y-4+'px';sp.width=r.w+8+'px';sp.height=r.h+8+'px';

 hand.firstChild.textContent=up?'👆':'👇';hand.style.left=r.x+r.w/2-19+'px';hand.style.top=(up?r.y+r.h+8:r.y-52)+'px';

const RCOL={'Обычная':'#6d8a5a','Необычная':'#3b82c4','Редкая':'#8a4fc7','Эпическая':'#e08a1e','Легендарная':'#c9302c','Мифическая':'#d81b8a'};
const CHEAP='carrot';
function poolWeights(){const pool=Object.keys(crops).filter(k=>k!==CHEAP),cnt={};pool.forEach(k=>cnt[crops[k].rarity]=(cnt[crops[k].rarity]||0)+1);const w={};let tot=0;pool.forEach(k=>{w[k]=RW[crops[k].rarity]/cnt[crops[k].rarity];tot+=w[k]});return{w,tot,pool}}
function chanceAppear(k){const {w,tot}=poolWeights();const p=w[k]/tot;return(1-Math.pow(1-p,3))*100}
function fmtP(p){return(p<1?p.toFixed(2):p<10?p.toFixed(1):Math.round(p))+'%'}
function fmtT(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function qtyFor(k){const i=Object.keys(RW).indexOf(crops[k].rarity),r=[[3,6],[2,4],[1,3],[1,2],[1,1],[1,1]][i];return r[0]+Math.floor(Math.random()*(r[1]-r[0]+1))}
function restock(){
 const {w,pool}=poolWeights(),items=[{k:CHEAP,qty:-1}],left=pool.slice(),forced=state.shop&&state.shop.force;
 for(let n=0;n<3;n++){
  let pick=null;
  if(n===0&&forced){const c=left.filter(k=>crops[k].rarity===forced);if(c.length)pick=c[Math.floor(Math.random()*c.length)]}
  if(!pick){const tot=left.reduce((a,k)=>a+w[k],0);let x=Math.random()*tot;for(const k of left){x-=w[k];if(x<=0){pick=k;break}}pick=pick||left[left.length-1]}
  left.splice(left.indexOf(pick),1);items.push({k:pick,qty:qtyFor(pick)});
 }
 items.sort((a,b)=>crops[a.k].seed-crops[b.k].seed);
 state.shop={items,next:Date.now()+30000,force:null};save();
}
function ensureShop(){if(!state.shop||!state.shop.items||!state.shop.items.length)restock()}
function seedsBody(){
 const s=state.shop;
 return '<div class="row" style="margin-bottom:14px"><span class="muted">Обновление через</span><b id="restockTimer" class="timerPill">'+fmtT(s.next-Date.now())+'</b></div><div class="items">'+s.items.map(it=>{
  const c=crops[it.k],inf=it.qty<0,out=!inf&&it.qty<=0;
  return '<div class="item'+(out?' out':'')+'"><span class="rar" style="background:'+RCOL[c.rarity]+'">'+c.rarity+'</span><h3>'+c.stages[3]+' '+c.name+'</h3><p>Рост '+c.grow+' сек. · Урожай '+c.value+' монет<br>'+(inf?'Всегда в наличии':'В наличии: '+Math.max(0,it.qty)+' · шанс '+fmtP(chanceAppear(it.k)))+'</p><button '+(out||state.coins<c.seed?'disabled':'')+' onclick="buySeed(\''+it.k+'\')">'+(out?'Раскуплено':c.seed+' монет')+'</button></div>';
 }).join('')+'</div><p class="muted" style="margin-top:14px">Каждые 30 секунд в магазин привозят 4 вида семян. Редкие растения попадаются не всегда, а самые дешёвые семена есть всегда.</p>';
}
function adminGiveHtml(){
 const opts=Object.keys(crops).map(k=>'<option value="'+k+'">'+crops[k].name+' ('+crops[k].rarity+')</option>').join('');
 return '<div class="item" style="margin-bottom:18px"><h3>Выдача</h3><p>Выдать себе растения, урожай, монеты или инструмент.</p><select id="giveCrop">'+opts+'</select><input id="giveQty" type="number" min="1" max="9999" value="5" placeholder="Количество"><button onclick="giveSeeds()">Выдать семена</button> <button class="secondary" onclick="giveHarvest()">Выдать урожай</button><input id="giveCoins" type="number" min="1" value="1000" placeholder="Монеты"><button class="gold" onclick="giveCoinsCustom()">Выдать монеты</button><select id="giveTool"><option value="fert">Удобрение</option><option value="sprinkler">Спринклер</option></select><button class="secondary" onclick="giveTool()">Выдать инструмент</button></div>';
}
const giveN=id=>Math.max(1,Math.min(999999999,Math.floor(Number($(id).value)||0)));
window.giveSeeds=()=>{const k=$('giveCrop').value,n=Math.min(9999,giveN('giveQty'));state.seeds[k]=(state.seeds[k]||0)+n;state.adminLog.push('Выдано семян: '+crops[k].name+' ×'+n);save();toast('Выдано: '+crops[k].name+' ×'+n)};
window.giveHarvest=()=>{const k=$('giveCrop').value,n=Math.min(9999,giveN('giveQty'));state.harvest[k]=(state.harvest[k]||0)+n;state.adminLog.push('Выдан урожай: '+crops[k].name+' ×'+n);save();toast('Урожай выдан: '+crops[k].name+' ×'+n)};
window.giveCoinsCustom=()=>{const n=giveN('giveCoins');state.coins+=n;state.adminLog.push('Выдано монет: '+n);updateHUD();save();toast('Выдано монет: '+n.toLocaleString('ru-RU'))};
window.giveTool=()=>{const k=$('giveTool').value;if(!state.ownedTools.includes(k))state.ownedTools.push(k);state.adminLog.push('Выдан инструмент: '+tools[k].name);save();toast('Выдано: '+tools[k].name)};
function adminStockHtml(){
 const s=state.shop;
 return '<div class="item" style="margin-bottom:18px"><h3>Сток семян</h3><p>Обновление через <b id="adminTimer">'+fmtT(s.next-Date.now())+'</b><br>Сейчас: '+s.items.map(i=>crops[i.k].name+(i.qty<0?' ∞':' ×'+Math.max(0,i.qty))).join(', ')+'</p><button onclick="adminRestock()">Обновить сток сейчас</button> <button class="secondary" onclick="adminTimer(5)">Таймер 5 сек</button><p style="margin:12px 0 0">Обновить с гарантией:</p><div class="row" style="flex-wrap:wrap;justify-content:flex-start;gap:6px">'+Object.keys(RW).slice(1).map(r=>'<button class="secondary" style="flex:1 1 45%;font-size:12px;padding:8px 4px" onclick="adminGuarantee(\''+r+'\')">'+r+'</button>').join('')+'</div><p style="margin:12px 0 0">Добавить в сток (+1):</p><div class="row" style="flex-wrap:wrap;justify-content:flex-start;gap:6px">'+Object.keys(crops).map(k=>'<button style="flex:1 1 30%;font-size:12px;padding:7px 3px" onclick="adminAddStock(\''+k+'\')">'+crops[k].name+'</button>').join('')+'</div><p class="muted" style="margin-top:12px">Шансы по редкости: '+Object.entries(RW).map(([r,v])=>r+' '+v+'%').join(' · ')+'</p></div>';
}
window.adminRestock=()=>{restock();state.adminLog.push('Сток обновлён');save();toast('Сток обновлён');openPanel('admin')};
window.adminTimer=n=>{state.shop.next=Date.now()+n*1000;state.adminLog.push('Таймер стока: '+n+' сек');save();toast('Таймер: '+n+' сек');openPanel('admin')};
window.adminGuarantee=r=>{state.shop.force=r;restock();state.adminLog.push('Сток с гарантией: '+r);save();toast('Гарантия: '+r);openPanel('admin')};
window.adminAddStock=k=>{const it=state.shop.items.find(x=>x.k===k);if(it){if(it.qty>=0)it.qty++}else state.shop.items.push({k,qty:1});state.shop.items.sort((a,b)=>crops[a.k].seed-crops[b.k].seed);state.adminLog.push('В сток: '+crops[k].name);save();toast('Добавлено: '+crops[k].name);openPanel('admin')};
setInterval(()=>{
 if(!state.shop)return;
 if(Date.now()>=state.shop.next){restock();toast('Магазин семян обновился');if(panelOpen('Магазин семян'))openPanel('seeds')}
 const a=$('restockTimer');if(a)a.textContent=fmtT(state.shop.next-Date.now());
 const b=$('adminTimer');if(b)b.textContent=fmtT(state.shop.next-Date.now());
},500);
load();if(state.speedMul)player.speed=190*state.speedMul;ensureWinterData();updateWinterBadge();ensureShop();state.petTick=state.petTick||Date.now();if(state.nick){$('login').classList.add('hidden');updateHUD();if(!state.tutDone)setTimeout(showTutorial,600)}else{$('login').classList.remove('hidden')}
})();
</script>
</body></html>
